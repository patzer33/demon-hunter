<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Caçador — Protótipo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="800"></canvas>
    <div id="hud">
      <div id="hp">HP: 100/100</div>
      <div id="weapon">ARMA: PISTOLA</div>
      <div id="ammo">PISTOLA: 12/12</div>
      <div id="reserve">RESERVA: 36</div>
      <div id="wave">ONDA: 1</div>
      <div id="score">PONTOS: 0</div>
    </div>
    <div id="controls">
      WASD move · Mouse mira · Clique ataca · 1 Pistola · 2 Katana · R Recarregar
    </div>
  </div>

  <!-- Ordem importa: bullet e weapon antes de player (que os usa) -->
  <script src="js/bullet.js"></script>
  <script src="js/weapon.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
